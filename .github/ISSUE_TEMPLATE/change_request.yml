name: Change request
description: Propose a controlled application, API, or schema change.
title: "[CHG] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, non-goals, and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, data, and rollback considerations
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and documentation plan
    validations:
      required: true
